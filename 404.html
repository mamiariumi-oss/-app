<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>かんじフレンズは おひっこししました</title>
<meta name="robots" content="noindex">
<style>body{margin:0;background:#FFF8EE;color:#2A2430;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}a{color:#1E6FA8;font-weight:700}</style>
</head><body><div><p style="font-size:20px;font-weight:700">かんじフレンズは あたらしい アドレスに おひっこししました</p>
<p>きろくを もって いどうしています…</p><p><a id="go" href="https://mamikkokanji.github.io/">https://mamikkokanji.github.io/</a></p></div>
<script>
(async function(){
  try{ if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations(); for(const r of rs) await r.unregister(); } }catch(e){}
  try{ if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); } }catch(e){}
  const sub=location.pathname.replace(/^\/-app\/?/,"/"), en=/^\/en(\/|$)/.test(sub);
  let dest="https://mamikkokanji.github.io/"+(en?"en/":"");
  const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(/^kanji/.test(k)&&!/^kanji-kakilog-/.test(k)) o[k]=localStorage.getItem(k); } }catch(e){}
  if(Object.keys(o).length){
    const b64=u=>{ let s=""; for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
    const txt=JSON.stringify(o);
    try{ const st=new Blob([txt]).stream().pipeThrough(new CompressionStream("gzip")); dest+="#kfimport=g:"+b64(new Uint8Array(await new Response(st).arrayBuffer())); }
    catch(e){ dest+="#kfimport=j:"+b64(new TextEncoder().encode(txt)); }
  }
  document.getElementById("go").href=dest; location.replace(dest);
})();
</script></body></html>
